<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="718" viewBox="0 0 1280 718" role="img" aria-labelledby="t d">
  <title id="t">Paper Trail module map</title>
  <desc id="d">The tabs in components call typed RPC handlers. lib/contract.ts defines the contract, lib/handlers has one file per feature, and server.ts registers them. Handlers use lib/engine (service, rating, grid, evidence, extensions, runner and queue, plus date, time, schedule, markdown and json helpers), lib/capture (prompts for the hidden threads: sources, context, identity, jira, confluence, github, slack, meetings) and lib/features (drift, guardrails, overrides, plan, goals, threads, ghost, packet, setup, migrate). All of it stores SQLite records through lib/storage.</desc>
