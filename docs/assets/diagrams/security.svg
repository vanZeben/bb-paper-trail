<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="t d">
  <title id="t">Paper Trail trust boundaries</title>
  <desc id="d">Third-party text from tickets, pull requests, meeting notes, chat, docs and code comments is untrusted. It only reaches the model inside an evidence fence whose marker is random for each prompt. Capture jobs run in auto mode with read tools and a read-only guard. Rating and judgment jobs run in accept-edits mode with no tools. Model replies pass strict validators (schema, known ids, https links, length caps) before they are stored in the local plugin database. Stored evidence re-enters only inside a fresh fence. Mode full is never used. Nothing is sent anywhere except prompts to your own agent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1214"/><stop offset="1" stop-color="#14201f"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#56706c"/></marker>
    <marker id="arrowA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2fd0b4"/></marker>
  </defs>
  <rect width="1280" height="600" rx="20" fill="url(#bg)"/>
  <g font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="48" y="44" font-size="13" font-weight="600" fill="#8fa6a2" letter-spacing="1.6">TRUST BOUNDARIES</text>
    <rect x="40" y="90" width="240" height="360" rx="16" fill="#101a1a" stroke="#e5a23c"/>
    <text x="60" y="120" font-size="13" font-weight="600" fill="#e5a23c" letter-spacing="1.6">NOT TRUSTED</text>
    <rect x="60" y="136" width="200" height="72" rx="12" fill="#182524" stroke="#2e4140"/>
    <rect x="60" y="146" width="4" height="52" rx="2" fill="#e5a23c"/>
    <text x="160" y="177.4" font-size="15" font-weight="400" fill="#e8f0ee" text-anchor="middle">Ticket and PR text</text>
    <rect x="60" y="228" width="200" height="72" rx="12" fill="#182524" stroke="#2e4140"/>
    <rect x="60" y="238" width="4" height="52" rx="2" fill="#e5a23c"/>
    <text x="160" y="259.6" font-size="15" font-weight="400" fill="#e8f0ee" text-anchor="middle">Meeting notes</text>
    <text x="160" y="279.1" font-size="15" font-weight="400" fill="#e8f0ee" text-anchor="middle">and chat</text>
    <rect x="60" y="320" width="200" height="72" rx="12" fill="#182524" stroke="#2e4140"/>
    <rect x="60" y="330" width="4" height="52" rx="2" fill="#e5a23c"/>
    <text x="160" y="351.6" font-size="15" font-weight="400" fill="#e8f0ee" text-anchor="middle">Docs and</text>
    <text x="160" y="371.1" font-size="15" font-weight="400" fill="#e8f0ee" text-anchor="middle">code comments</text>
    <text x="160" y="424" font-size="12.5" fill="#6f8581" text-anchor="middle">third-party words, never instructions</text>
    <rect x="330" y="90" width="440" height="366" rx="16" fill="#101a1a" stroke="#263534"/>
    <text x="350" y="120" font-size="13" font-weight="600" fill="#8fa6a2" letter-spacing="1.6">YOUR AGENT, ON YOUR HOST</text>
    <rect x="350" y="124" width="400" height="316" rx="12" fill="none" stroke="#e5a23c" stroke-width="1.5" stroke-dasharray="7 5"/>
    <text x="366" y="147" font-size="12.5" font-weight="600" fill="#e5a23c" letter-spacing="1.2">EVIDENCE FENCE · RANDOM PER PROMPT</text>
    <rect x="370" y="169" width="360" height="98" rx="12" fill="#182524" stroke="#2e4140"/>
    <rect x="370" y="179" width="4" height="78" rx="2" fill="#2fd0b4"/>
    <text x="550" y="223.4" font-size="15" font-weight="400" fill="#e8f0ee" text-anchor="middle"></text>
    <rect x="370" y="323" width="360" height="98" rx="12" fill="#182524" stroke="#2e4140"/>
    <rect x="370" y="333" width="4" height="78" rx="2" fill="#2fd0b4"/>
    <text x="550" y="377.4" font-size="15" font-weight="400" fill="#e8f0ee" text-anchor="middle"></text>
    <text x="378" y="203" font-size="16" font-weight="600" fill="#e8f0ee">Capture jobs</text>
    <text x="378" y="226" font-size="13.5" fill="#8fa6a2">mode: auto · read tools only</text>
    <text x="378" y="246" font-size="13.5" fill="#8fa6a2">read-only guard blocks every write</text>
    <text x="378" y="357" font-size="16" font-weight="600" fill="#e8f0ee">Rating and judgment jobs</text>
    <text x="378" y="380" font-size="13.5" fill="#8fa6a2">mode: accept-edits · no tools at all</text>
    <text x="378" y="400" font-size="13.5" fill="#8fa6a2">see only the fenced evidence</text>
    <text x="550" y="478" font-size="13" fill="#8fa6a2" text-anchor="middle">Mode full is never used.</text>
    <rect x="820" y="90" width="200" height="240" rx="16" fill="#101a1a" stroke="#263534"/>
    <text x="840" y="120" font-size="13" font-weight="600" fill="#8fa6a2" letter-spacing="1.6">STRICT VALIDATORS</text>
    <rect x="838" y="128" width="164" height="36" rx="12" fill="#182524" stroke="#2e4140"/>
    <text x="920" y="150.9" font-size="13.5" font-weight="400" fill="#e8f0ee" text-anchor="middle">schema and types</text>
    <rect x="838" y="174" width="164" height="36" rx="12" fill="#182524" stroke="#2e4140"/>
    <text x="920" y="196.9" font-size="13.5" font-weight="400" fill="#e8f0ee" text-anchor="middle">known ids only</text>
    <rect x="838" y="220" width="164" height="36" rx="12" fill="#182524" stroke="#2e4140"/>
    <text x="920" y="242.9" font-size="13.5" font-weight="400" fill="#e8f0ee" text-anchor="middle">https links only</text>
    <rect x="838" y="266" width="164" height="36" rx="12" fill="#182524" stroke="#2e4140"/>
    <text x="920" y="288.9" font-size="13.5" font-weight="400" fill="#e8f0ee" text-anchor="middle">length caps</text>
    <text x="920" y="318" font-size="12.5" fill="#6f8581" text-anchor="middle">nothing unchecked is stored</text>
    <rect x="1070" y="150" width="170" height="130" rx="16" fill="#182524" stroke="#2fd0b4" stroke-width="2"/>
    <text x="1155" y="191.1" font-size="17" font-weight="700" fill="#e8f0ee" text-anchor="middle">Local plugin</text>
    <text x="1155" y="213.2" font-size="17" font-weight="700" fill="#e8f0ee" text-anchor="middle">database</text>
    <text x="1155" y="254.7" font-size="13" font-weight="400" fill="#8fa6a2" text-anchor="middle">SQLite, on this machine</text>
    <path d="M282 218 L348 218" fill="none" stroke="#56706c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="315" y="206" font-size="13" font-weight="600" fill="#8fa6a2" text-anchor="middle">read</text>
    <path d="M732 218 L818 218" fill="none" stroke="#56706c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="775" y="206" font-size="13" font-weight="600" fill="#8fa6a2" text-anchor="middle">model reply</text>
    <path d="M732 372 L776 372 L776 300 L818 300" fill="none" stroke="#56706c" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <path d="M1022 215 L1068 215" fill="none" stroke="#2fd0b4" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrowA)"/>
    <path d="M1155 282 L1155 410 L900 410" fill="none" stroke="#56706c" stroke-width="2" stroke-dasharray="6 5" stroke-linejoin="round" marker-end="url(#arrow)"/>
    <text x="1155" y="432" font-size="12.5" fill="#6f8581" text-anchor="middle">stored evidence re-enters</text>
    <text x="1155" y="448.25" font-size="12.5" fill="#6f8581" text-anchor="middle">only inside a fresh fence</text>
    <rect x="40" y="500" width="1200" height="64" rx="16" fill="#182524" stroke="#2fd0b4"/>
    <text x="640" y="528.8" font-size="16" font-weight="600" fill="#e8f0ee" text-anchor="middle">Nothing is sent anywhere except prompts to your own agent.</text>
    <text x="640" y="550.9" font-size="13.5" font-weight="400" fill="#8fa6a2" text-anchor="middle">No credentials in the plugin, no outbound calls of its own, no telemetry. Data stays in the local plugin database.</text>
  </g>
</svg>
