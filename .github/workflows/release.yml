name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string

# Attaching the build to the release needs write access to contents.
permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the tag format
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag \"$TAG\" is not vX.Y.Z (optionally with a pre-release suffix)."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$pkg" ]; then
            echo "::error::Tag $TAG does not match package.json version $pkg at the tagged commit. Delete this release and the tag $TAG, merge the version bump pull request, then publish the release again. Never move a published tag."
            exit 1
          fi

      # better-sqlite3 (a dev dependency for the tests) is built or fetched by npm ci.
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
      - name: Install the pinned bb CLI
        run: npm i -g "bb-app@$(cat .github/bb-version)"
      - name: Build and check the app bundle
        run: npm run check:app

      - name: Build from a clean production install
        run: |
          set -euo pipefail
          clean="$RUNNER_TEMP/clean-build"
          mkdir -p "$clean"
          tar --exclude=./node_modules --exclude=./.git --exclude=./dist -cf - . | tar -xf - -C "$clean"
          cd "$clean"
          npm ci --omit=dev --ignore-scripts
          bb plugin build

      - name: Package the build
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/paper-trail-${TAG}.tar.gz" dist package.json
          (cd "$RUNNER_TEMP" && sha256sum "paper-trail-${TAG}.tar.gz" > "paper-trail-${TAG}.tar.gz.sha256")

      - name: Attach the build to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$RUNNER_TEMP/paper-trail-${TAG}.tar.gz" "$RUNNER_TEMP/paper-trail-${TAG}.tar.gz.sha256" --clobber --repo "${{ github.repository }}"

      - name: Summary
        run: |
          {
            echo "## Release ${TAG} verified and built"
            echo
            echo "Tests, typecheck, the app bundle check and a clean production build passed, and the build is attached to the release."
            echo
            echo "The marketplace listing is a manual step: see [docs/RELEASING.md](${{ github.server_url }}/${{ github.repository }}/blob/main/docs/RELEASING.md#marketplace-listing-manual)."
          } >> "$GITHUB_STEP_SUMMARY"
